<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Playbook Closers · Pensión Perfecta</title>
<style>
  :root{
    --ground:#eceee8;--card:#fffdf8;--ink:#16211b;--muted:#5a655c;--faint:#93a094;
    --line:#dcd8cb;--green:#14683f;--green-ink:#0d4e2f;--green-soft:#e7f0e9;
    --gold:#b0873a;--wash:#f7f4ec;--c1:#14683f;--c2:#b0873a;--c3:#2f7d76;
    --font:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0b0f0c;--card:#141a15;--ink:#e9ede7;--muted:#97a296;--faint:#6b766c;
    --line:#252d26;--green:#54c188;--green-ink:#83d6aa;--green-soft:#15251b;
    --gold:#d3aa60;--wash:#111611;--c1:#54c188;--c2:#d3aa60;--c3:#57b3a9;}}
  :root[data-theme="dark"]{
    --ground:#0b0f0c;--card:#141a15;--ink:#e9ede7;--muted:#97a296;--faint:#6b766c;
    --line:#252d26;--green:#54c188;--green-ink:#83d6aa;--green-soft:#15251b;--gold:#d3aa60;--wash:#111611;--c1:#54c188;--c2:#d3aa60;--c3:#57b3a9;}
  :root[data-theme="light"]{
    --ground:#eceee8;--card:#fffdf8;--ink:#16211b;--muted:#5a655c;--faint:#93a094;
    --line:#dcd8cb;--green:#14683f;--green-ink:#0d4e2f;--green-soft:#e7f0e9;--gold:#b0873a;--wash:#f7f4ec;--c1:#14683f;--c2:#b0873a;--c3:#2f7d76;}
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;justify-content:center;padding:clamp(14px,2.4vw,26px)}
  .wrap{max-width:1120px;margin:0 auto;width:100%}
  .hero{text-align:center;margin-bottom:clamp(16px,2.2vw,24px)}
  .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:0 0 10px}
  h1{font-size:clamp(26px,4.2vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
  .tag{font-size:clamp(13px,1.7vw,17px);color:var(--green-ink);font-weight:700;margin:11px 0 0}
  .hint{color:var(--faint);font-size:12.5px;margin:8px 0 0}
  .tl{display:grid;grid-template-columns:repeat(3,1fr);column-gap:clamp(12px,2vw,26px);align-items:stretch}
  .line{grid-row:1;grid-column:1/-1;height:3px;background:var(--line);border-radius:2px;align-self:start;margin-top:8px;z-index:0}
  .mark{grid-row:1;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--ground)}
  .stg{font-size:16px;font-weight:800;color:var(--c);letter-spacing:-.01em;margin-top:3px}
  .sub{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .rsm{font-size:12px;color:var(--muted);line-height:1.4;max-width:30ch;margin-top:5px}
  .post{grid-row:2;position:relative;padding-top:15px;margin-top:8px}
  .post::before{content:"";position:absolute;left:50%;top:0;width:2px;height:12px;background:var(--c);transform:translateX(-50%)}
  .post ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .it{display:block;text-decoration:none;color:inherit;border-radius:11px;padding:9px 13px;background:var(--wash);border:1px solid var(--line);transition:border-color .12s,transform .12s}
  a.it:hover{border-color:var(--c);transform:translateY(-1px)}
  .it .nm{font-weight:700;font-size:13.6px;line-height:1.25;color:var(--ink)}
  a.it .nm{color:var(--green-ink)}
  a.it .nm::after{content:" ↗";color:var(--gold);font-size:10.5px;font-weight:800}
  .it.soon .nm::after{content:" · pronto";color:var(--faint);font-size:10px;font-weight:700}
  .it .wy{font-size:11.6px;color:var(--muted);line-height:1.35;margin-top:2px}

  .foot{text-align:center;margin-top:clamp(18px,2.4vw,28px)}
  .foot p{margin:0;font-size:clamp(14px,1.9vw,19px);font-weight:800;letter-spacing:-.015em}
  .foot p em{font-style:normal;color:var(--green)}
  @media (max-width:760px){
    .tl{grid-template-columns:1fr;row-gap:6px}
    .mark,.post{grid-row:auto!important;grid-column:auto!important}
    .post::before,.line{display:none}
    .mark{align-items:flex-start;text-align:left;margin-top:10px}.rsm{max-width:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <p class="eyebrow">Pensión Perfecta · Equipo de Closers</p>
    <h1>Playbook Closers</h1>
    <p class="tag">Sistema para entender, organizar y controlar cada parte del proceso.</p>
    <p class="hint">Clic en cada pieza para abrirla.</p>
  </div>

  <div class="tl" id="tl"></div>

  <div class="foot"><p><em>Todo en un solo lugar.</em> Lo construimos entre todos: con tu feedback y lo que aprendimos juntos en las llamadas.</p></div>
</div>
<script>
(function(){
  var B="https://francoherrerasa-creator.github.io/calificador.closers/";
  var DOC="https://docs.google.com/document/d/1fsip3unaq0up69KEDSEaShEsFDpkyvNFwJeoNo7X3tg/edit";
  var SOP="https://docs.google.com/document/d/1ectV-TciEX8ydq0yrd-agRY9r2l-tmee4zMUBfX4BZA/edit";
  var CREDITIA="https://creditia-phi.vercel.app/";
  var MEDIA="https://drive.google.com/drive/folders/1RpApcV4uYt3e0nLJ9Nl8xcT3OOjJZXu7?usp=drive_link";
  var FORMS="https://forms.gle/GeDypheodBS6rgP58";
  var S=[
    {c:"var(--c1)",stg:"BackOffice",sub:"CRM y Sistemas",
     rsm:"Los sistemas y estándares que ordenan tu operación.",
     post:[
       {nm:"SOP del Closer",wy:"Estándar de calidad del equipo",url:SOP},
       {nm:"Versiones de mensajes",wy:"Evita el bloqueo de líneas",url:DOC},
       {nm:"Creditia",wy:"Califica e identifica al lead",url:CREDITIA}
     ]},
    {c:"var(--c2)",stg:"Journey del lead",sub:"Paso a paso dentro de la operación",
     rsm:"El recorrido del lead, paso a paso, de la llamada al grupo.",
     post:[
       {nm:"Journey del Pipe CF-M",wy:"Paso a paso de qué hacer",url:B+"pipe-m/"},
       {nm:"Guión 6 minutos",wy:"Máxima duración de la llamada",soon:true},
       {nm:"Grupos de WhatsApp",wy:"Qué mandar y en qué momento",url:B+"journey/"}
     ]},
    {c:"var(--c3)",stg:"Soporte y Mejora Continua",sub:"Resolver, mejorar y continuar",
     rsm:"Tu apoyo para resolver dudas y seguir mejorando.",
     post:[
       {nm:"Resuelve tu duda",wy:"Objeciones, producto y tus dudas, al instante",url:B+"resuelve/"},
       {nm:"Imágenes y Videos",wy:"Material de apoyo para el lead",url:MEDIA},
       {nm:"Canales de comunicación",wy:"Para organizar cada cosa por su lugar",url:FORMS}
     ]}
  ];
  var tl=document.getElementById('tl');
  function cell(cls,col,html,c){var d=document.createElement('div');d.className=cls;d.style.gridColumn=col;d.style.setProperty('--c',c);d.innerHTML=html;return d;}
  var ln=document.createElement('div');ln.className='line';tl.appendChild(ln);
  S.forEach(function(s,i){tl.appendChild(cell('mark',i+1,'<span class="dot"></span><span class="stg">'+s.stg+'</span><span class="sub">'+s.sub+'</span><span class="rsm">'+s.rsm+'</span>',s.c));});
  S.forEach(function(s,i){
    var items=s.post.map(function(it){
      var tag=it.url?'a':'div',attr=it.url?(' href="'+it.url+'" target="_blank" rel="noopener"'):'';
      var cl='it'+(it.soon?' soon':'');
      return '<'+tag+' class="'+cl+'"'+attr+'><div class="nm">'+it.nm+'</div><div class="wy">'+it.wy+'</div></'+tag+'>';
    }).join('');
    tl.appendChild(cell('post',i+1,'<ul>'+items+'</ul>',s.c));
  });
})();
</script>
</body>
</html>
