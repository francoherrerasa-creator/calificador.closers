<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Journey del lead despues de agendar | Pension Perfecta</title>
<meta name="author" content="Franco Herrera">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4C5;</text></svg>">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%;height:auto;border-style:none}a{color:inherit}h1,h2,p{margin:0}button{font:inherit}</style>
</head>
<body>

<style>
:root{
  --paper:#EEF1EC; --card:#FFFFFF; --ink:#0F1E18; --muted:#5B6B62; --hair:#D3DCD4;
  --axis:#C2CEC5; --band:#E1E7E0; --bandink:#3C4E44;
  --closer:#157A4E; --asesor:#2160C4; --sistema:#4A5D6B;
  --shadow:0 1px 2px rgba(15,30,24,.05), 0 16px 34px -20px rgba(15,30,24,.3);
  --veil:rgba(12,22,18,.55);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0A100D; --card:#141F1A; --ink:#E4EDE7; --muted:#8FA79A; --hair:#22322B;
    --axis:#2A3D34; --band:#1A2721; --bandink:#9CB6A8;
    --closer:#40C787; --asesor:#5C9CF6; --sistema:#93AABA;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 34px -20px rgba(0,0,0,.85);
    --veil:rgba(0,0,0,.68);
  }
}
:root[data-theme="light"]{
  --paper:#EEF1EC; --card:#FFFFFF; --ink:#0F1E18; --muted:#5B6B62; --hair:#D3DCD4;
  --axis:#C2CEC5; --band:#E1E7E0; --bandink:#3C4E44;
  --closer:#157A4E; --asesor:#2160C4; --sistema:#4A5D6B;
  --shadow:0 1px 2px rgba(15,30,24,.05), 0 16px 34px -20px rgba(15,30,24,.3);
  --veil:rgba(12,22,18,.55);
}
:root[data-theme="dark"]{
  --paper:#0A100D; --card:#141F1A; --ink:#E4EDE7; --muted:#8FA79A; --hair:#22322B;
  --axis:#2A3D34; --band:#1A2721; --bandink:#9CB6A8;
  --closer:#40C787; --asesor:#5C9CF6; --sistema:#93AABA;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 34px -20px rgba(0,0,0,.85);
  --veil:rgba(0,0,0,.68);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}

.sheet{max-width:1500px; margin:0 auto; padding:44px 24px 56px}

.head{text-align:center; max-width:70ch; margin:0 auto}
.eyebrow{margin:0 0 12px; font-size:11px; font-weight:850; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted)}
h1{margin:0; font-size:clamp(26px,4.2vw,42px); line-height:1.05; letter-spacing:-.03em;
  font-weight:850; text-wrap:balance}

.scroller{margin-top:52px; overflow-x:auto; overflow-y:hidden; padding:0 2px 10px}
.rail{min-width:1120px}

.phases{display:grid; grid-template-columns:3fr 4fr 1fr; gap:16px; margin-bottom:22px}
.ph{text-align:center; padding-bottom:11px; border-bottom:2px solid var(--hair)}
.ph span{font-size:11px; font-weight:850; letter-spacing:.13em; text-transform:uppercase;
  color:var(--bandink); white-space:nowrap}

.grid{position:relative; display:grid; grid-template-columns:repeat(8,1fr); gap:0 6px;
  align-items:start}
.axis{grid-column:1/-1; grid-row:1; position:relative; height:0}
.axis::before{content:""; position:absolute; left:6.2%; right:6.2%; top:29px;
  height:3px; background:var(--axis); border-radius:2px}

.node{grid-row:1; display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:0 4px; text-align:center; position:relative; z-index:2}
.node.c{--c:var(--closer)} .node.a{--c:var(--asesor)} .node.s{--c:var(--sistema)}

.med{width:58px; height:58px; border-radius:50%; background:var(--c); color:#fff;
  display:grid; place-items:center; font-size:21px; font-weight:850;
  font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 7px var(--paper), 0 8px 20px -8px var(--c);
  transition:transform .18s ease}
.node.s .med{background:var(--card); color:var(--c); border:2px dashed var(--c);
  box-shadow:0 0 0 7px var(--paper), 0 8px 20px -10px rgba(0,0,0,.35)}

.ico{width:30px; height:30px; border-radius:50%; background:var(--card);
  border:1.5px solid var(--c); display:grid; place-items:center; color:var(--c);
  box-shadow:0 0 0 5px var(--paper); margin-top:-3px}
.ico svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round}

.tit{font-size:13px; font-weight:850; letter-spacing:.05em; text-transform:uppercase;
  color:var(--c); line-height:1.15}
.res{font-size:12.5px; color:var(--muted); line-height:1.35; min-height:3.5em;
  max-width:20ch; text-wrap:balance}
.more{margin-top:2px; font-size:10px; font-weight:850; letter-spacing:.08em;
  text-transform:uppercase; color:var(--c); opacity:0; transition:opacity .18s ease}
.node:hover .med, .node:focus-visible .med{transform:scale(1.1)}
.node:hover .more, .node:focus-visible .more{opacity:1}
.node:focus-visible{outline:2.5px solid var(--c); outline-offset:6px; border-radius:14px}

.keys{display:flex; justify-content:center; flex-wrap:wrap; gap:10px 30px; margin-top:44px}
.key{display:inline-flex; align-items:center; gap:10px; font-size:14px; font-weight:750}
.sw{width:18px; height:18px; border-radius:50%}
.key.c .sw{background:var(--closer)}
.key.s .sw{background:transparent; border:2px dashed var(--sistema)}
.key.a .sw{background:var(--asesor)}

.fecha{display:block; margin-top:38px; text-align:center;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px; font-weight:600; color:var(--closer); letter-spacing:.03em}

/* modal */
dialog{padding:0; border:0; background:transparent; max-width:none; max-height:none}
dialog::backdrop{background:var(--veil); backdrop-filter:blur(3px)}
.box{background:var(--card); border:1px solid var(--hair); border-radius:18px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.5); width:min(720px,93vw); max-height:88vh;
  display:flex; flex-direction:column; overflow:hidden; position:relative}
.det{padding:28px 30px 30px; overflow:auto}
.det.c{--c:var(--closer)} .det.a{--c:var(--asesor)} .det.s{--c:var(--sistema)}
.dphase{margin:0 0 16px; font-size:11px; font-weight:850; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted)}
.dhead{display:flex; align-items:center; gap:16px; margin-bottom:20px}
.dnum{width:56px; height:56px; border-radius:50%; background:var(--c); color:#fff;
  display:grid; place-items:center; font-size:23px; font-weight:850;
  font-variant-numeric:tabular-nums; flex:none}
.det.s .dnum{background:var(--card); color:var(--c); border:2px dashed var(--c)}
.det h2{margin:0 0 8px; font-size:clamp(19px,2.3vw,25px); line-height:1.16;
  letter-spacing:-.02em; font-weight:850; text-wrap:balance}
.who{font-size:10.5px; font-weight:850; letter-spacing:.09em; text-transform:uppercase;
  color:#fff; background:var(--c); border-radius:5px; padding:3px 9px}
.det.s .who{color:var(--c); background:transparent; border:1.5px dashed var(--c)}
.dbody{border-top:1px solid var(--hair); padding-top:20px;
  display:flex; flex-direction:column; gap:14px}
.dbody p{margin:0; font-size:15.5px; color:var(--ink); opacity:.88; text-wrap:pretty}
.dbody p strong{opacity:1; font-weight:700}
.dbody ul{margin:0; padding-left:20px; font-size:15px; color:var(--ink); opacity:.88}
.dbody li{margin-bottom:4px}
.guion{background:var(--band); border-radius:12px; padding:15px 17px;
  font-size:15.5px; line-height:1.55; text-wrap:pretty}
.guion .lbl{display:block; font-size:10px; font-weight:850; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); margin-bottom:7px}
.guion .var{color:var(--c); font-weight:700}
.guion .rem{display:block; margin-top:11px; font-size:13px; color:var(--muted); font-weight:650}
.photo{width:100%; max-width:290px; border-radius:12px; border:1px solid var(--hair);
  display:block; align-self:center}
.plab{margin:0; font-size:12.5px; color:var(--muted); text-align:center; font-weight:600}
.enlace{display:inline-flex; align-items:center; gap:12px; text-decoration:none;
  color:var(--ink); border:1.5px solid var(--c); border-radius:12px; padding:13px 16px;
  align-self:flex-start}
.enlace:hover{background:var(--band)}
.enlace .play{width:28px; height:28px; border-radius:50%; background:var(--c); flex:none;
  position:relative}
.enlace .play::after{content:""; position:absolute; left:11px; top:7px;
  border-left:9px solid #fff; border-top:7px solid transparent; border-bottom:7px solid transparent}
.enlace b{display:block; font-size:15px}
.enlace small{display:block; font-size:12px; color:var(--muted)}

.bar{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:13px 16px; border-top:1px solid var(--hair); background:var(--card); flex:none}
.btn{border:1px solid var(--hair); background:var(--card); color:var(--ink);
  border-radius:10px; padding:9px 15px; font-size:13.5px; font-weight:700}
.btn:disabled{opacity:.32; cursor:default}
.btn.primary{background:var(--closer); border-color:var(--closer); color:#fff}
.x{position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--hair); background:var(--card); font-size:17px; line-height:1; z-index:3}
:focus-visible{outline:2.5px solid var(--closer); outline-offset:3px}

@media(max-width:900px){
  .sheet{padding:30px 16px 44px}
  .scroller{overflow:visible}
  .rail{min-width:0}
  .phases{display:none}
  .grid{grid-template-columns:repeat(2,1fr); gap:30px 10px}
  .axis{display:none}
  .med{box-shadow:0 8px 20px -8px var(--c)}
  .ico{box-shadow:none}
  .res{min-height:0}
  .more{opacity:1}
  .det{padding:24px 18px 26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="sheet">

  <header class="head">
    <p class="eyebrow">Closers de financiamiento</p>
    <h1>Journey del lead después de agendar</h1>
  </header>

  <div class="scroller">
    <div class="rail">
      <div class="phases">
        <div class="ph"><span>Al agendar</span></div>
        <div class="ph"><span>Día de la asesoría</span></div>
        <div class="ph"><span>En la asesoría</span></div>
      </div>
      <div class="grid"><div class="axis"></div></div>
    </div>
  </div>

  <div class="keys">
    <span class="key c"><i class="sw"></i>Lo haces tú</span>
    <span class="key s"><i class="sw"></i>Lo manda el sistema solo</span>
    <span class="key a"><i class="sw"></i>Lo hace el asesor</span>
  </div>

  <span class="fecha">Vigente desde el 12 de agosto de 2026</span>
</div>

<dialog id="dlg" aria-modal="true" aria-label="Detalle del paso">
  <div class="box">
    <button class="x" id="x" type="button" aria-label="Cerrar">&#10005;</button>
    <div class="det" id="det"></div>
    <div class="bar">
      <button class="btn" id="prev" type="button">&larr; Anterior</button>
      <button class="btn primary" id="next" type="button">Siguiente &rarr;</button>
    </div>
  </div>
</dialog>

const grid = document.querySelector('.grid');
grid.insertAdjacentHTML('beforeend', P.map((s,i)=>`
  <button class="node ${s.r}" type="button" data-i="${i}" aria-haspopup="dialog"
     aria-label="Paso ${i+1}, ${s.t}. Ver el detalle">
    <span class="med">${i+1}</span>
    <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">${IC[s.i]}</svg></span>
    <span class="tit">${s.t}</span>
    <span class="res">${s.res}</span>
    <span class="more">Ver detalle</span>
  </button>`).join(''));

const dlg = document.getElementById('dlg');
const det = document.getElementById('det');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
let cur = 0;

function bloque(b){
  if(b.p) return `<p>${b.p}</p>`;
  if(b.ul) return `<ul>${b.ul.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.g) return `<div class="guion"><span class="lbl">${b.lbl}</span>${b.g}${b.rem?`<span class="rem">${b.rem}</span>`:''}</div>`;
  if(b.img) return `<img class="photo" src="${b.img}" alt="${b.cap}"><p class="plab">${b.cap}</p>`;
  if(b.link) return `<a class="enlace" href="${b.link}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span><b>${b.b}</b><small>${b.s}</small></span></a>`;
  return '';
}

function pinta(i){
  cur = i;
  const s = P[i];
  det.className = 'det ' + s.r;
  det.innerHTML = `
    <p class="dphase">${s.fase} · Paso ${i+1} de ${P.length}</p>
    <div class="dhead">
      <span class="dnum">${i+1}</span>
      <div><h2>${s.h}</h2><span class="who">${s.quien}</span></div>
    </div>
    <div class="dbody">${s.body.map(bloque).join('')}</div>`;
  prev.disabled = i === 0;
  next.disabled = i === P.length - 1;
  det.scrollTop = 0;
}

grid.addEventListener('click', e=>{
  const b = e.target.closest('.node');
  if(!b) return;
  pinta(+b.dataset.i);
  dlg.showModal();
});
prev.addEventListener('click', ()=>{ if(cur>0) pinta(cur-1); });
next.addEventListener('click', ()=>{ if(cur<P.length-1) pinta(cur+1); });
document.getElementById('x').addEventListener('click', ()=>dlg.close());
dlg.addEventListener('click', e=>{ if(e.target === dlg) dlg.close(); });
dlg.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' && cur<P.length-1) pinta(cur+1);
  if(e.key==='ArrowLeft' && cur>0) pinta(cur-1);
});
</script>
